<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e242d"/>
      <stop offset="70%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="30%" stop-color="#d7ae69"/>
      <stop offset="70%" stop-color="#b6893c"/>
      <stop offset="100%" stop-color="#e8c784"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7126"/>
      <stop offset="50%" stop-color="#e6c37a"/>
      <stop offset="100%" stop-color="#fff4d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Disc -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Outer Islamic 8-Point Geometric Star Motif -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.45">
    <rect x="76" y="76" width="360" height="360" rx="16" transform="rotate(0 256 256)"/>
    <rect x="76" y="76" width="360" height="360" rx="16" transform="rotate(45 256 256)"/>
    <circle cx="256" cy="256" r="218" stroke-dasharray="4,6"/>
  </g>

  <!-- Inner Ornate Circle -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Open Quran Book on Rihal Stand -->
  <!-- Left Page -->
  <path d="M256 295 C220 280 160 270 115 285 C108 287 102 281 102 274 L102 182 C102 176 107 171 113 169 C162 153 222 165 256 185 Z" 
        fill="#181e26" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Left Page Lines / Details -->
  <path d="M130 195 C165 186 210 194 238 206 M130 217 C165 208 210 216 238 228 M130 239 C165 230 210 238 238 250 M130 261 C165 252 210 260 238 272" 
        stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Page -->
  <path d="M256 295 C292 280 352 270 397 285 C404 287 410 281 410 274 L410 182 C410 176 405 171 399 169 C350 153 290 165 256 185 Z" 
        fill="#181e26" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Right Page Lines / Details -->
  <path d="M382 195 C347 186 302 194 274 206 M382 217 C347 208 302 216 274 228 M382 239 C347 230 302 238 274 250 M382 261 C347 252 302 260 274 272" 
        stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Spine / Ribbon Bookmark -->
  <path d="M256 185 L256 320" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 310 Q266 335 275 350 L256 342 L237 350 Q246 335 256 310" fill="url(#goldGrad)"/>

  <!-- Wooden Rihal / Rehal Cross Base -->
  <path d="M175 290 L135 365 C132 370 136 376 142 376 L185 376 L230 300 Z" fill="url(#goldAccent)" opacity="0.95"/>
  <path d="M337 290 L377 365 C380 370 376 376 370 376 L327 376 L282 300 Z" fill="url(#goldAccent)" opacity="0.95"/>

  <!-- Center Floating Noor / Light Star -->
  <g filter="url(#glow)">
    <circle cx="256" cy="138" r="7" fill="url(#goldGrad)"/>
    <path d="M256 118 L259 133 L274 138 L259 143 L256 158 L253 143 L238 138 L253 133 Z" fill="url(#goldAccent)"/>
  </g>
</svg>