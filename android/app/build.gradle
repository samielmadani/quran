plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.samielmadani.quran'
    compileSdk 36

    def signingProperty = { String name ->
        project.findProperty(name) ?: System.getenv(name)
    }
    def releaseSigningProperties = [
        storeFile: signingProperty('RELEASE_STORE_FILE'),
        storePassword: signingProperty('RELEASE_STORE_PASSWORD'),
        keyAlias: signingProperty('RELEASE_KEY_ALIAS'),
        keyPassword: signingProperty('RELEASE_KEY_PASSWORD')
    ]
    def configuredSigningProperties = releaseSigningProperties.findAll { entry -> entry.value }

    if (!configuredSigningProperties.isEmpty() && configuredSigningProperties.size() != releaseSigningProperties.size()) {
        throw new GradleException('Release signing requires RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD.')
    }

    signingConfigs {
        if (configuredSigningProperties.size() == releaseSigningProperties.size()) {
            release {
                storeFile file(releaseSigningProperties.storeFile)
                storePassword releaseSigningProperties.storePassword
                keyAlias releaseSigningProperties.keyAlias
                keyPassword releaseSigningProperties.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.samielmadani.quran'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (configuredSigningProperties.size() == releaseSigningProperties.size()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':capacitor-android')
    
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.annotation:annotation:1.8.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
